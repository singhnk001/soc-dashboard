scheduled.exec_interval_secs = 10
decoding.codec = "bytes"

[sources.win_defender]
type = "exec"
mode = "scheduled"
command = ["powershell.exe","-NoProfile","-NonInteractive","-ExecutionPolicy","Bypass","-File","D:\\SOC-Dashboard\\Dashboard\\vector\\collect-events3.ps1","-Channel","Microsoft-Windows-Windows Defender/Operational","-StateFile","D:\\SOC-Dashboard\\Dashboard\\vector\\data3\\state_Defender.txt"]
scheduled.exec_interval_secs = 10
