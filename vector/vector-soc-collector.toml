[sources.win_taskscheduler]
type = "exec"
mode = "scheduled"
command = ["powershell.exe","-NoProfile","-NonInteractive","-ExecutionPolicy","Bypass","-File","D:\\SOC-Dashboard\\Dashboard\\vector\\collect-events3.ps1","-Channel","Microsoft-Windows-TaskScheduler/Operational","-StateFile","D:\\SOC-Dashboard\\Dashboard\\vector\\data3\\state_TaskScheduler.txt"]
scheduled.exec_interval_secs = 10
decoding.codec = "bytes"

[transforms.parse_logs]
type   = "remap"
inputs = ["win_security","win_system","win_application","win_powershell","win_defender","win_taskscheduler"]
source = '''
  .message = string!(.message)
  parsed, err = parse_json(.message)
  if err == null {
    . = merge!(., parsed)
  }
  del(.source_type)
'''

[sinks.http_soc]
type    = "http"
inputs  = ["parse_logs"]
uri     = "http://127.0.0.1:8002/api/logs/ingest"
method  = "post"
encoding.codec = "json"
framing.method = "newline_delimited"

[sinks.http_soc.batch]
max_events   = 50
timeout_secs = 1

[sinks.http_soc.request]
retry_attempts = 5
retry_initial_backoff_secs = 1