[api]
enabled = true
address  = "127.0.0.1:8687"

[sources.win_security]
type = "exec"
mode = "scheduled"
command = ["powershell.exe","-NoProfile","-NonInteractive","-ExecutionPolicy","Bypass","-File","D:\\SOC-Dashboard\\Dashboard\\vector\\collect-events3.ps1","-Channel","Security","-StateFile","D:\\SOC-Dashboard\\Dashboard\\vector\\data3\\state_Security.txt"]
scheduled.exec_interval_secs = 5
